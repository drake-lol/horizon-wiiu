[package]
name = "wiiu-atomics"
version = "0.1.0"
edition = "2021"
description = "64-bit atomic libcalls (__atomic_*_8) for the Espresso CPU, which has no native 64-bit atomics"

[workspace]

[dependencies]

[features]
# Cemu lacks nsysnet.set_multicast_state; skip wut's socket init so programs run there.
skip-socket-init = []
# Print the message OSFatal gets (via OSReport) instead of stopping silently.
trace-fatal = []
