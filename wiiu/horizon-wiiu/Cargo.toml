[package]
name = "horizon-wiiu"
version = "0.1.0"
edition = "2021"
description = "Horizon for Wii U: GX2 front end (own workspace; builds with wiiu/build tooling)"

[workspace]

[dependencies]
horizon-world = { path = "../../crates/horizon-world" }
horizon-core = { path = "../../crates/horizon-core" }
horizon-protocol = { path = "../../crates/horizon-protocol" }
wut-sys = { path = "../wut-sys" }
wiiu-atomics = { path = "../atomics", features = ["console-stdout", "trace-fatal"] }

[profile.release]
opt-level = "s"
panic = "abort"
debug = false
